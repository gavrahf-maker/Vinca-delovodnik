<!doctype html>
<html lang="sr-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Деловодник Заштита</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=cyrillic">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>window.FIREBASE_CONFIG=window.FIREBASE_CONFIG||null;</script>
<script src="firebase-config.js" onerror="void 0"></script>
<style>
/* Layout: пуна висина — тамна навигациона трака лево, радна површина десно; Vinča индиго + Черенков цијан + злато */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface2:#F7F8FC; --line:#E2E4EF; --line2:#D3D6E6;
  --ink:#16182E; --muted:#5E6280; --faint:#8A8DA8;
  --indigo:#484888; --indigo-ink:#3B3B78; --indigo-soft:#E8E8F4;
  --cyan:#17879F; --cyan-soft:#DDF2F7; --gold:#A86A0E; --gold-soft:#FBEFD9;
  --danger:#B93A27; --danger-soft:#FBE5E0; --ok:#257A4C; --ok-soft:#DEF1E5;
  --nav:#12142B; --nav2:#1D2045; --nav-ink:#B9BCDD; --nav-active:#2FB8D4; --dot:#2FB8D4; --gold-dot:#E9A23B;
  --shadow:0 1px 2px rgba(18,20,43,.06),0 4px 16px rgba(18,20,43,.05);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F22; --surface:#161936; --surface2:#1B1F40; --line:#2A2E55; --line2:#363B68;
  --ink:#ECEDF8; --muted:#A3A6C8; --faint:#7C80A6;
  --indigo:#9A9AE6; --indigo-ink:#B7B7F2; --indigo-soft:#262A58;
  --cyan:#55CBE3; --cyan-soft:#12394A; --gold:#F0B457; --gold-soft:#3A2D14;
  --danger:#F28A77; --danger-soft:#43201B; --ok:#68D096; --ok-soft:#163625;
  --nav:#080918; --nav2:#151834; --nav-ink:#A9ACD3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F22; --surface:#161936; --surface2:#1B1F40; --line:#2A2E55; --line2:#363B68;
  --ink:#ECEDF8; --muted:#A3A6C8; --faint:#7C80A6;
  --indigo:#9A9AE6; --indigo-ink:#B7B7F2; --indigo-soft:#262A58;
  --cyan:#55CBE3; --cyan-soft:#12394A; --gold:#F0B457; --gold-soft:#3A2D14;
  --danger:#F28A77; --danger-soft:#43201B; --ok:#68D096; --ok-soft:#163625;
  --nav:#080918; --nav2:#151834; --nav-ink:#A9ACD3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:84px 1fr;height:100%}
/* ---- навигација ---- */
.nav{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;align-items:stretch;gap:2px;
  padding:14px 8px calc(12px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));overflow-y:auto}
.nav .brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 14px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.nav .brand img{width:40px;height:40px}
.nav .brand span{font-size:9.5px;letter-spacing:.14em;font-weight:600;color:#fff;opacity:.9}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border-radius:10px;color:var(--nav-ink);text-decoration:none;font-size:10.5px;font-weight:500;text-align:center;line-height:1.15;position:relative}
.nav a svg{width:22px;height:22px}
.nav a:hover{background:var(--nav2);color:#fff}
.nav a.on{background:var(--nav2);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--nav-active)}
.nav a .badge{position:absolute;top:4px;right:10px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#E05A43;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.nav .spacer{flex:1}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:6px 6px}
.nav .me{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 2px;cursor:pointer;background:none;border:0;color:var(--nav-ink);font-size:10px}
.nav .me .av{width:34px;height:34px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;border:2px solid rgba(47,184,212,.6)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---- радна површина ---- */
.main{overflow-y:auto;height:100%;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grid3{display:inline-grid;grid-template-columns:repeat(3,4px);gap:2px}
.grid3 i{width:4px;height:4px;border-radius:50%;background:var(--indigo)}
.grid3.c i{background:var(--cyan)}
h1{font-size:28px;line-height:1.15;font-weight:600;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{border-color:var(--indigo)}
.btn.pri{background:var(--indigo);border-color:var(--indigo);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0D0F22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0D0F22}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.card .cb{padding:4px 18px 18px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--line2)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .v{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi .dotk{width:8px;height:8px;border-radius:50%}
/* ток */
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:0;padding:6px 18px 18px}
.stage{position:relative;padding:12px 10px 12px 14px;border:0;background:none;text-align:left;cursor:pointer;border-radius:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stage:hover{background:var(--surface2)}
.stage .n{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1}
.stage .t{font-size:12.5px;color:var(--muted);line-height:1.25}
.stage .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.stage .bar i{display:block;height:100%;background:var(--indigo);border-radius:3px}
.stage .warn{font-size:11.5px;font-weight:600;color:var(--danger);display:flex;gap:4px;align-items:center;min-height:16px}
.stage .warn svg{width:13px;height:13px;flex:none}
.stage:not(:last-child)::after{content:"";position:absolute;right:-6px;top:22px;width:12px;height:12px;border-top:2px solid var(--line2);border-right:2px solid var(--line2);transform:rotate(45deg)}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* аларми */
.alarms{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.al:first-child{border-top:0}
.sev{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.sev svg{width:18px;height:18px}
.sev.crit{background:var(--danger-soft);color:var(--danger)}
.sev.warn{background:var(--gold-soft);color:var(--gold)}
.sev.info{background:var(--cyan-soft);color:var(--cyan)}
.al .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .dd{font-size:12.5px;color:var(--muted)}
.al .age{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.empty{padding:22px 4px;color:var(--muted);text-align:center;font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.plain::before{display:none}
.chip.indigo{background:var(--indigo-soft);color:var(--indigo-ink);border-color:transparent}
.chip.cyan{background:var(--cyan-soft);color:var(--cyan);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}

/* мини графикон */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--indigo-soft);display:block}
.bars .b.cur i{background:var(--indigo)}
.bars .b span{font-size:10.5px;color:var(--faint)}
.bars .b em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.feed{display:flex;flex-direction:column}
.feed .fi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.feed .fi:first-child{border-top:0}
.av-s{width:28px;height:28px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo-ink);display:grid;place-items:center;font-size:11px;font-weight:600}
.feed .fi div{font-size:13px}
.feed .fi small{color:var(--faint);font-size:11.5px}
.wk{display:flex;flex-direction:column;gap:8px}
.wk .d{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.wk .d:first-child{border-top:0}
.wk .dn{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wk .dn b{display:block;font-family:var(--mono);font-size:18px;color:var(--ink);letter-spacing:0;font-weight:500}
.ev{font-size:13px;padding:6px 9px;border-radius:7px;background:var(--cyan-soft);color:var(--ink);margin-bottom:4px;cursor:pointer}
.ev small{display:block;color:var(--muted);font-size:11.5px}

/* табеле и филтери */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 220px;min-width:0}
.search svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:34px}
.in,select.in,textarea.in{width:100%;height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);min-width:0}
textarea.in{height:auto;min-height:76px;padding:9px 11px;resize:vertical;line-height:1.45}
.in:focus{outline:2px solid var(--cyan);outline-offset:-1px;border-color:transparent}
.toolbar select.in{width:auto;max-width:220px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--indigo);width:16px;height:16px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--surface2)}
.t td.r,.t th.r{text-align:right}
.t td.wrapc{max-width:340px}
.t td.ph{white-space:nowrap}
.t.dl{font-size:12.5px}
.t.dl th{white-space:normal;line-height:1.25;min-width:64px;vertical-align:bottom}
.t.dl td{padding:8px 10px;vertical-align:top}
.t.dl td.nw{white-space:nowrap}
.t.dl td.w1{min-width:110px;max-width:150px}
.t.dl td.w2{min-width:140px;max-width:220px}
.t.dl td.sm{font-size:12px}
.wrap.wide{max-width:none}
.gap{font-size:11.5px;color:var(--danger);margin-top:4px;white-space:normal;line-height:1.3}
.t .muted{color:var(--muted)}
.t .who{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.t .who .av-s{width:22px;height:22px;font-size:10px}
.tfoot{display:flex;justify-content:space-between;padding:12px 16px;color:var(--muted);font-size:12.5px}
.t input.in{height:34px}
.t tr.edit td{cursor:default}

/* календар */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.cal .h{padding:9px 10px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.cal .c{min-height:112px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:4px}
.cal .c:nth-child(7n){border-right:0}
.cal .c.out{background:var(--surface2)}
.cal .c.out .dnum{color:var(--faint)}
.cal .c.today .dnum{background:var(--indigo);color:#fff}
.cal .c.we{background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.cal .dnum{font-family:var(--mono);font-size:12.5px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.cal .ev{margin:0;font-size:12px;padding:4px 7px;overflow:hidden;line-height:1.3}
.cal .ev .evw,.cal .ev .evk{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev .evw{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:2px;white-space:normal}
.cal .ev .evw i{font-style:normal;font-weight:700;font-size:11px;line-height:1;padding:3px 5px;border-radius:5px;background:var(--indigo);color:var(--surface);letter-spacing:.02em}
.cal .ev .evw em{font-style:normal;color:var(--muted)}
.cal .ev .evk{color:var(--muted);font-size:11.5px}

/* документација */
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.doc{padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.doc .nm{font-weight:600}
.doc .mt{font-size:12.5px;color:var(--muted)}
.doc a{color:var(--cyan);font-size:13px;word-break:break-all}

/* панел за унос (drawer) */
.scrim{position:fixed;inset:0;background:rgba(10,11,28,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;box-shadow:-10px 0 40px rgba(10,11,28,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(980px,100%)}
.drawer.on{transform:none}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dh h3{margin:4px 0 0;font-size:20px;font-weight:600}
.db{flex:1;overflow-y:auto;padding:18px 22px 26px;display:flex;flex-direction:column;gap:22px}
.df{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.span{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:500;color:var(--muted)}
.f .hint{font-size:11.5px;color:var(--faint)}
.hist{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;gap:8px;align-items:center}
.phase-now{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.steps{display:flex;gap:4px;flex:1}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--indigo)}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;font-size:13px}
.multi input{accent-color:var(--indigo)}

/* ставке понуде */
.items{width:100%;border-collapse:collapse;font-size:13px}
.items th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.items td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.items td.r{padding-top:14px}
.items td.r{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.items input.in{height:34px;padding:0 8px}
.items .k{width:64px}.items .p{width:110px}.items .v{width:62px}
.totals{display:grid;grid-template-columns:auto auto;gap:6px 18px;justify-content:end;font-size:13.5px;margin-top:6px}
.totals span{color:var(--muted);text-align:right}
.totals b{font-family:var(--mono);font-weight:500;text-align:right}
.totals .big{font-size:17px;color:var(--ink)}

.ob{display:block;max-width:1060px}

function phaseOf(e){
  if((e.status||'')==='Одбијено')return 'odbijeno';
  // Фаза = следећи корак после последње попуњене колоне: … → Бр. уговора (може да остане празно) → Бр. радног налога → Испитивач → Бр. документа → Захтев за фактурисање (извоз PDF) → Бр. фактуре
  if(isInterni(e))return e.brFakture?'zatvoreno':'faktura';
  if(e.brFakture)return 'zatvoreno';
  if(e.zahtevFakt)return 'zahtev';
  if(e.brDokumenta)return 'faktura';
  if(e.ispitivac)return 'realizacija';
  if(e.brNaloga)return 'ispitivac';
  if(e.status==='Прихваћено'||e.brUgovora)return isProjekat(e)?'ispitivac':'nalog';
  if(e.opis==='Јавна набавка'&&!e.status)return 'odgovor'; // јавна набавка чека одлуку (Статус) без рока важења

  if(e.opis==='Понуда')return 'priprema'; // број понуде се тражи само за „Понуда“
  if(isProjekat(e))return 'ispitivac';
  return 'nalog';
}
/* Прескочени кораци: колона лево од последње попуњене остала празна (Бр. уговора сме да буде празан) */
const STEP_COLS=[['brNaloga','Бр. радног налога'],['ispitivac','Испитивач'],['brDokumenta','Бр. документа'],['zahtevFakt',null],['brFakture',null]];

const isInterni=e=>/^(лаб|лабораторија|lab)\s*\d+$/.test(nkey(e.korisnik));
/* Услуге које се раде само електронски (Пројекти, Мишљење, Допис, Сертификати…): нема радног налога ни терена; прати се ко израђује (Испитивач), Бр. документа (израђен) и фактурисање. Листа: Подешавања → Листе → „Услуге без радног налога“ */
const isProjekat=e=>(cfg().lists.bezNaloga||[]).some(v=>nkey(v)===nkey(e.vrsta));
function phaseGaps(e){if((e.status||'')==='Одбијено'||isInterni(e))return [];let last=-1;STEP_COLS.forEach(([k],i)=>{if(String(e[k]||'').trim())last=i});
  const g=last<1?[]:STEP_COLS.slice(0,last).filter(([k,l])=>l&&!String(e[k]||'').trim()&&!(k==='brNaloga'&&isProjekat(e))).map(x=>x[1]);
  // Број понуде се тражи само кад је опис захтева „Понуда“
  if(e.opis==='Понуда'&&!String(e.brPonude||'').trim()&&(e.status==='Прихваћено'||last>=0||String(e.brUgovora||'').trim()))g.unshift('Бр. понуде');

function alarms(){
  const P=cfg().pragovi, out=[];
  const win=+P.alarmDana||0;
  for(const e of S.entries){const k=phaseOf(e),p=PH[k];if(!p.prag)continue;
    if(k==='odgovor'){const age=daysSince(offerDate(e)),lim=+P.cekaOdgovor||0,left=vaziDana()-age,jn=e.opis==='Јавна набавка';if(age<lim||(jn&&win&&daysSince(e.datum)>win))continue;
      out.push({sev:jn?'warn':left<=5?'crit':'warn',age,ageLbl:jn?`${age} д`:left<=0?'истиче данас':`важи још ${left} д`,title:`Р.б. ${e.rb} · ${e.korisnik||'—'}`,desc:`Чека одговор купца · понуда од ${fmtD(offerDate(e))}`,open:()=>openEntry(e.id),key:'e'+e.id});continue}
    if(win&&daysSince(e.datum)>win)continue;
    const age=daysSince(e.fazaOd||e.datum),lim=+P[p.prag]||0;if(age<=lim)continue;
    out.push({sev:age>2*lim?'crit':'warn',age,title:`Р.б. ${e.rb} · ${e.korisnik||'—'}`,desc:`${p.t} — дуже од ${lim} ${lim===1?'дана':'дана'}`,open:()=>openEntry(e.id),key:'e'+e.id});}
  for(const p of S.projects){if(p.status==='Завршено')continue;
    if(p.datumSlanja&&!p.datumPrijema){const age=daysSince(p.datumSlanja),lim=+P.projekatObrazac;if(age>lim)out.push({sev:age>2*lim?'crit':'warn',age,title:`Пројекат ${p.delBroj||''} · ${p.korisnik||'—'}`,desc:'Образац послат, а није враћен',open:()=>openProject(p.id),key:'p'+p.id});}}
  for(const d of S.docs){if(!d.vaziDo)continue;const left=-daysSince(d.vaziDo);if(left<=45)out.push({sev:left<0?'crit':left<=15?'warn':'info',age:left<0?-left:left,ageLbl:left<0?`истекло пре ${-left} д`:`за ${left} д`,title:d.naziv||'Документ',desc:left<0?'Важење је истекло':'Важење ускоро истиче',open:()=>openDoc(d.id),key:'d'+d.id});}
  const w={crit:0,warn:1,info:2};return out.sort((a,b)=>w[a.sev]-w[b.sev]||b.age-a.age);
}

function subscribe(db){

/* Приказ после стизања података: requestAnimationFrame, уз резерву setTimeout — неки прегледачи (позадински/уграђени прозори) не покрећу rAF, па би остао екран „Учитавање…“ */

async function save(coll,id,data,akcija){
  if(!S.db){toast('База није доступна — измене се не чувају.');throw new Error('nodb')}
  const prev=id?S[coll].find(x=>x.id===id):null, now=nowISO();
  const body={...data};delete body.id;
  body.createdBy=prev?.createdBy||S.me;body.createdAt=prev?.createdAt||now;body.updatedBy=S.me;body.updatedAt=now;
  body.istorija=[...(prev?.istorija||[]).slice(-19),{ko:S.me,kada:now,akcija:akcija||(prev?'Измена':'Унос')}];
  const ref=id?S.db.collection(coll).doc(id):S.db.collection(coll).doc();
  try{await ref.set(body)}catch(e){handleWriteErr(e);throw e}
  return ref.id;
}

    setMe(n);L.hidden=true;cancelAnimationFrame(loginAnim);addMeToList();render()};

function drawLattice(cv){
  if(!cv)return;const ctx=cv.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;let t0=performance.now();
  const frame=t=>{const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;if(cv.width!==r.width*dpr){cv.width=r.width*dpr;cv.height=r.height*dpr}
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);const cx=r.width/2,cy=r.height/2,n=15,st=Math.min(r.width,r.height)/18,half=(n-1)/2,mr=Math.hypot(half,half);
    const ph=reduce?0:(t-t0)/1600;
    ctx.strokeStyle='rgba(163,163,195,.25)';ctx.lineWidth=1;[st*5.2,st*7.6].forEach(rr=>{ctx.beginPath();ctx.arc(cx,cy,rr,0,7);ctx.stroke()});
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){const d=Math.hypot(i-half,j-half)/mr;const pulse=.5+.5*Math.sin(ph-d*6);const s=(1.2+5.2*Math.pow(1-d,1.6))*(0.85+0.3*pulse);
      ctx.fillStyle=d<.28?`rgba(47,184,212,${.7+.3*pulse})`:d<.6?`rgba(163,163,195,${.55+.3*pulse})`:'rgba(72,72,136,.8)';ctx.beginPath();ctx.arc(cx+(i-half)*st,cy+(j-half)*st,s,0,7);ctx.fill()}
    if(!reduce&&!$('#login').hidden)loginAnim=requestAnimationFrame(frame)};
  loginAnim=requestAnimationFrame(frame);
}

function openEditor(kind,id,entryId){
  const K=KIND[kind],ex=id?S[K.coll].find(x=>x.id===id):null;
  const draft=ex?JSON.parse(JSON.stringify(ex)):(kind==='offer'?newOfferDraft(entryId):newZahtevDraft(entryId));
  if(!draft.stavke?.length)draft.stavke=[blankItem(kind)];
  S.ed={kind,id:ex?id:null,draft};

  if(S.page===K.page)render(true);else location.hash=K.page;
}
const blankItem=kind=>kind==='offer'?{usluga:'',jm:'КОМ',kol:1,cena:0,pdv:cfg().ponuda.pdv}:{usluga:'',kol:1,cena:0};

function bindEditor(root,inDrawer){

}

function itemsBind(root,kind,o,onChange){
  const P=cfg().ponuda,isO=kind==='offer';
  const lineT=s=>money((+s.kol||0)*(+s.cena||0)*(isO?1+(+s.pdv||0)/100:1));
  const draw=()=>{$('#its',root).innerHTML=o.stavke.map((s,i)=>`<tr data-i="${i}"><td><input class="in" list="dl_sv" data-k="usluga" value="${esc(s.usluga)}" placeholder="Изаберите услугу из ценовника" aria-label="Услуга">${isO&&isVan(s.usluga)?`<span class="vo">* ван обима акредитације</span>`:''}</td>${isO?`<td><input class="in v" data-k="jm" value="${esc(s.jm)}" aria-label="ЈМ"></td>`:''}<td><input class="in k num" type="number" min="0" step="any" data-k="kol" value="${esc(s.kol)}" aria-label="Количина"></td><td><input class="in p num" type="number" min="0" step="any" data-k="cena" value="${esc(s.cena)}" aria-label="Цена"></td>${isO?`<td><input class="in v num" type="number" step="any" data-k="pdv" value="${esc(s.pdv)}" aria-label="ПДВ"></td>`:''}<td class="r">${lineT(s)}</td><td><button type="button" class="btn sm ghost" data-rm="${i}" aria-label="Уклони ставку">${icon('x')}</button></td></tr>`).join('');onChange()};
  draw();
  $('#its',root).addEventListener('input',ev=>{const inp=ev.target,tr=inp.closest('tr');if(!tr)return;const i=+tr.dataset.i,k=inp.dataset.k;if(!k)return;o.stavke[i][k]=inp.value;
    if(k==='usluga'){const sv=S.services.find(s=>s.naziv===inp.value);if(sv){o.stavke[i].cena=sv.cena;tr.querySelector('[data-k=cena]').value=sv.cena;if(isO){o.stavke[i].jm=sv.jm||'КОМ';tr.querySelector('[data-k=jm]').value=o.stavke[i].jm}}
      if(isO){const has=tr.querySelector('.vo');if(isVan(inp.value)&&!has)inp.insertAdjacentHTML('afterend','<span class="vo">* ван обима акредитације</span>');if(!isVan(inp.value)&&has)has.remove()}}
    tr.querySelector('td.r').textContent=lineT(o.stavke[i]);onChange()});
  $('#its',root).addEventListener('click',ev=>{const b=ev.target.closest('[data-rm]');if(!b)return;o.stavke.splice(+b.dataset.rm,1);if(!o.stavke.length)o.stavke.push(blankItem(kind));draw()});
  $('#addIt',root).onclick=()=>{if(o.stavke.length>=MAXST){toast(`Највише ${MAXST} ставки.`);return}o.stavke.push(blankItem(kind));draw();$$('#its tr',root).at(-1).querySelector('input').focus()};
  return draw;
}

  ${rows.map(o=>{const t=offerTotals(o),e=S.entries.find(e=>e.id===o.entryId)||S.entries.find(e=>e.brPonude===o.broj);return `<tr data-id="${o.id}"><td class="num"><b>${esc(o.broj)}</b></td><td class="num muted">${fmtD(o.datum)}</td><td>${esc(o.kupac?.naziv)}</td><td class="num muted">${e?'Р.б. '+esc(e.rb):'—'}</td><td>${e?phaseChip(phaseOf(e)):'<span class="chip plain">Без предмета</span>'}</td><td class="r num">${money(t.iznos)}</td><td class="r num"><b>${money(t.ukupno)}</b></td><td>${who(o.updatedBy)}</td><td class="r"><button class="btn sm" data-pdf="${o.id}">${icon('pdf')}PDF</button></td></tr>`}).join('')}
  </tbody></table>${rows.length?'':`<div class="empty"><b>Још нема понуда</b>Направите понуду дугметом „Нова понуда“ или из предмета у деловоднику.</div>`}</div></section>

const exportsCard=(t,list,emptyT)=>`<section class="card"><div class="ch"><h2>${t}</h2><span class="sub" style="margin:0;font-size:12.5px">Сваки извоз се памти тачно онакав какав је послат</span></div>

function bindOfferForm(root){
  const P=cfg().ponuda,o=S.ed.draft;
  const sync=()=>{o.broj=val('broj');o.datum=val('datum');o.zahtevOd=val('zahtevOd');o.nacinPlacanja=val('nacinPlacanja');o.rokPlacanja=val('rokPlacanja');o.rokVazenja=val('rokVazenja');o.entryId=$('#f_entry').value;
    o.kupac={naziv:val('kNaziv'),adresa:val('kAdresa'),grad:val('kGrad'),pib:val('kPib'),kontakt:val('kKontakt')}};
  const tot=()=>{const t=offerTotals(o);$('#tot',root).innerHTML=`<span>Износ</span><b>${money(t.iznos)}</b><span>ПДВ</span><b>${money(t.pdv)}</b><span>Укупно</span><b class="big">${money(t.ukupno)} дин.</b>`};
  itemsBind(root,'offer',o,tot);
  const form=$('#edForm',root);
  form.addEventListener('input',ev=>{if(ev.target.closest('#its'))return;sync()});form.addEventListener('change',ev=>{if(ev.target.closest('#its'))return;sync()});
  $('#f_entry').addEventListener('change',()=>{const e=S.entries.find(x=>x.id===$('#f_entry').value);if(!e)return;$('#f_broj').value=offerNoFor(e,val('datum'));
    if(!val('kNaziv')){$('#f_kNaziv').value=e.korisnik||'';$('#f_kNaziv').dispatchEvent(new Event('change'))}if(!val('zahtevOd'))setD('zahtevOd',e.datum);sync()});

  S.ed.save=async()=>{sync();
    const d={broj:o.broj,datum:o.datum,zahtevOd:o.zahtevOd,nacinPlacanja:o.nacinPlacanja,rokPlacanja:o.rokPlacanja,rokVazenja:o.rokVazenja,entryId:o.entryId,kupac:{...o.kupac},
      stavke:o.stavke.filter(s=>String(s.usluga).trim()).map(s=>({usluga:String(s.usluga).trim(),jm:s.jm||'КОМ',kol:+s.kol||0,cena:+s.cena||0,pdv:s.pdv===''?P.pdv:+s.pdv}))};

    if(!d.datum){toast('Унесите датум издавања у облику ДД/ММ/ГГГГ.');return null}

      const e=S.entries.find(x=>x.id===d.entryId);if(e&&e.brPonude!==d.broj){const ne={...e,brPonude:d.broj};if(e.brPonude&&!/^\d+(-\d+)?\/\d+$/.test(e.brPonude))ne.napomena=[e.napomena,'Раније у колони понуде: '+e.brPonude].filter(Boolean).join(' · ');ne.fazaOd=phaseOf(ne)!==phaseOf(e)?todayISO():(e.fazaOd||e.datum);await save('entries',e.id,ne,'Понуда '+d.broj)}
      return {...d,id:nid}}catch(e){return null}};

async function makePdfBlob(kind,o,P){
  const st=$('#pdfStage');st.innerHTML=kind==='zahtev'?zahtevA4(o,P):offerA4(o,P);
  await Promise.all($$('img',st).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
  const cv=await html2canvas(st.firstElementChild,{scale:2.2,backgroundColor:'#ffffff',useCORS:true,logging:false});
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297);
  pdf.setProperties({title:(kind==='zahtev'?'Захтев за фактурисање ':'Понуда ')+o.broj,author:S.me||'',creator:'Деловодник Заштита'});
  st.innerHTML='';return pdf.output('blob');
}
async function saveFile(blob,name){
  if(S.dl){await S.dl.save({filename:name,data:blob});return true}
  if(window.showSaveFilePicker){
    try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'PDF документ',accept:{'application/pdf':['.pdf']}}]});const w=await h.createWritable();await w.write(blob);await w.close();return true}
    catch(e){if(e?.name==='AbortError')return false;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true;
}

VIEWS.teren=()=>{
  if(!S.cal){const t=todayISO();S.cal={y:+t.slice(0,4),m:+t.slice(5,7)-1}}
  const {y,m}=S.cal,first=new Date(y,m,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));const tIso=todayISO();
  const cells=[...Array(42)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const iso=isoOf(d);return{d,iso}});
  const last=cells.slice(35).every(c=>c.d.getMonth()!==m)?35:42;
  return head('Распоред терена','Терен',`${MONTHS[m][0].toUpperCase()+MONTHS[m].slice(1)} ${y}. · ${S.field.filter(f=>(f.datum||'').startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).length} излазака`,
   `<button class="btn" id="cp" aria-label="Претходни месец">${icon('left')}</button><button class="btn" id="ct">Данас</button><button class="btn" id="cn" aria-label="Следећи месец">${icon('right')}</button><button class="btn pri" id="nf">${icon('plus')}Нов излазак</button>`)+
  `<section class="card" style="overflow:hidden"><div class="cal">${DOW.map(d=>`<div class="h">${d}</div>`).join('')}
   ${cells.slice(0,last).map(({d,iso})=>{const ev=S.field.filter(f=>f.datum===iso);return `<div class="c ${d.getMonth()!==m?'out':''} ${iso===tIso?'today':''} ${d.getDay()%6===0?'we':''}" data-day="${iso}"><span class="dnum">${d.getDate()}</span>${ev.map(f=>{const who=(f.ispitivaci||[]).join(', ');return `<div class="ev" data-fid="${f.id}" title="${esc(who)}${who?' — ':''}${esc(f.korisnik)}"><span class="evw">${(f.ispitivaci||[]).length?(f.ispitivaci||[]).map(n=>`<i>${esc(initials(n))}</i>`).join(''):'<em>—</em>'}</span><span class="evk">${esc(f.korisnik||'—')}</span></div>`}).join('')}</div>`}).join('')}</div></section>`;
};

  </tbody></table>${rows.length?'':`<div class="empty"><b>Ценовник је празан</b>Додајте прву услугу.</div>`}</div><div class="tfoot"><span>${rows.length} услуга</span><span></span></div></section>`;
};
BIND.usluge=()=>{

  `<section class="card"><div class="toolbar"><div class="search">${icon('search')}<input class="in" id="cq" placeholder="Претрага: назив, пун назив, место, ПИБ" value="${esc(S.cq)}"></div></div>
  <div class="tw"><table class="t"><thead><tr><th>Корисник</th><th>Адреса</th><th>Место</th><th>ПИБ</th><th>Контакт</th><th class="r">Предмета</th></tr></thead><tbody>

};
BIND.korisnici=()=>{let tm;$('#cq').oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{S.cq=$('#cq').value;const p=$('#cq').selectionStart;render();$('#cq').focus();$('#cq').setSelectionRange(p,p)},180)};
  $('#nc').onclick=()=>openClient(null);$$('tr[data-id]').forEach(r=>r.onclick=()=>openClient(r.dataset.id))};
function openClient(id){
  const c=id?S.clients.find(x=>x.id===id):{};
  openDrawer(dHead('Корисник',id?esc(c.naziv):'Нов корисник')+`<form class="db" id="kf"><div class="sec"><div class="fg">
    ${field('naziv','Назив (за понуде)',c.naziv,'text',{span:true})}${field('alias','Назив у деловоднику',(c.alias||[]).join(', '),'text',{span:true,hint:'Како се корисник уписује у деловодник, нпр. ДЗ Чукарица. Више назива одвојте зарезом. По овом називу понуда и захтев за фактурисање проналазе адресу и ПИБ.'})}${field('punNaziv','Пун назив (за захтев за фактурисање)',c.punNaziv,'text',{span:true,hint:'Ако је празно, користи се кратак назив'})}${field('adresa','Адреса',c.adresa)}${field('mesto','Место',c.mesto)}${field('pib','ПИБ',c.pib)}${field('kontakt','Контакт',c.kontakt)}</div></div>${histHtml(id?c:null)}</form>
    <div class="df"><div>${id?`<button class="btn danger" id="del">${icon('trash')}Обриши</button>`:''}</div><div class="actions"><button class="btn" data-close>Откажи</button><button class="btn pri" id="sv">${icon('check')}Сачувај</button></div></div>`);
  $('#kf').onsubmit=e=>e.preventDefault();
  $('#sv').onclick=async()=>{const d={naziv:val('naziv'),alias:val('alias').split(',').map(s=>s.trim()).filter(Boolean),punNaziv:val('punNaziv'),adresa:val('adresa'),mesto:val('mesto'),pib:val('pib'),kontakt:val('kontakt')};if(!d.naziv){toast('Унесите назив.');return}
    if(S.clients.some(x=>x.naziv===d.naziv&&x.id!==id)){toast('Корисник са тим називом већ постоји.');return}try{await save('clients',id,d);closeDrawer(true);toast('Корисник је сачуван.')}catch(e){}};
  if($('#del'))$('#del').onclick=()=>confirmBox('Обрисати корисника?',c.naziv,'Обриши',async()=>{await remove('clients',id);closeDrawer(true)});
}

/* ---------- ПОДЕШАВАЊА ---------- */
const LIST_LBL={opisZahteva:'Опис захтева',vrsteUsluga:'Врсте услуга',preispitivanje:'Преиспитивање захтева',primaoci:'Примаоци захтева',ispitivaci:'Испитивачи',statusZahteva:'Статус захтева',zahtevFakt:'Захтев за фактурисање (у предмету)',bezNaloga:'Услуге без радног налога (раде се електронски)',vrsteRacuna:'Врсте рачуна',rokoviPlacanja:'Рокови плаћања',projektiDokumenti:'Документи пројеката',statusProjekta:'Статус пројекта',standardi:'Методе (стандарди)',dokKategorije:'Категорије документације',zaposleni:'Колеге (пријава)'};
const PRAG_LBL={pripremaPonude:'Припрема понуде',cekaOdgovor:'Чека одговор купца: аларм од дана (0 = одмах по изради понуде)',vaziPonuda:'Понуда важи (дана); после тога се одговор не чека',cekaNalog:'Чека радни налог',cekaIspitivac:'Чека испитивача',realizacija:'У реализацији',fakturisanje:'За фактурисање',izdatZahtev:'Издат захтев, чека број фактуре',projekatObrazac:'Пројекат: образац није враћен',alarmDana:'Аларми само за предмете млађе од (дана, 0 = сви)'};
const POND_LBL={nacinPlacanja:'Начин плаћања',rokPlacanja:'Рок плаћања',rokVazenja:'Рок важења',pdv:'Стопа ПДВ-а (%)',funkcija:'Функција потписника',oj:'Организациона јединица',potpisnik:'Потписник',banka:'Текући рачун и банка',mb:'Матични број',pib:'ПИБ',oznaka:'Ознака обрасца',vanObima:'Напомена за услуге са звездицом (*)',footer1:'Подножје, ред 1',footer2:'Подножје, ред 2'};
const ZAH_LBL={oznaka:'Ознака обрасца',verzija:'Верзија',lab1:'Назив лабораторије, ред 1',lab2:'Назив лабораторије, ред 2',tehRukovodilac:'Технички руководилац (подразумевано)',rokPlacanja:'Рок плаћања (подразумевано)'};
VIEWS.podesavanja=()=>{const C=cfg();
  return head('Шифарници и правила','Подешавања','Листе за падајуће менија, рокови за аларме и подаци који се штампају на понуди и захтеву за фактурисање.',`<button class="btn pri" id="ss">${icon('check')}Сачувај подешавања</button>`)+
  `<div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
   <div class="stack"><section class="card"><div class="ch"><h2>Рокови за аларме (дана)</h2></div><div class="cb"><div class="fg">${Object.keys(PRAG_LBL).map(k=>field('pr_'+k,PRAG_LBL[k],C.pragovi[k],'number')).join('')}</div>
     <p class="sub" style="font-size:12.5px">Предмет постаје „упозорење“ кад пређе рок, а „хитно“ кад пређе двоструки рок. Понуда која чека одговор је у алармима од задатог дана до истека важења (последњих 5 дана „хитно“); после тога прелази у „Понуда истекла“ и не броји се у отворене. Старији предмети из увезеног Excel-а не пуне листу аларма ако је задата граница старости.</p></div></section>
   <section class="card"><div class="ch"><h2>Захтев за фактурисање — образац</h2></div><div class="cb"><div class="fg">${Object.keys(ZAH_LBL).map(k=>field('za_'+k,ZAH_LBL[k],C.zahtev[k])).join('')}</div></div></section>
</div>
   <section class="card"><div class="ch"><h2>Понуда — образац</h2></div><div class="cb"><div class="fg">${Object.keys(POND_LBL).map(k=>field('po_'+k,POND_LBL[k],C.ponuda[k],k==='pdv'?'number':'text',k==='vanObima'?{span:true,hint:'Штампа се изнад текста испод ставки само кад понуда има услугу чији назив почиње звездицом.'}:{})).join('')}${field('po_napomena','Текст испод ставки',C.ponuda.napomena,'textarea',{span:true,rows:8})}</div></div></section>
  </div>
  <section class="card"><div class="ch"><h2>Почетни подаци</h2></div><div class="cb" style="display:flex;flex-direction:column;gap:14px">
    <p class="sub" style="margin:0">Увоз из фајла <b>pocetni-podaci.json</b> (направљен из Excel-а „Delovodnik 2026“): предмети, корисници, услуге са ценама, пројекти, евиденција захтева за фактурисање, уговори, распоред терена и шифарници.</p>
    ${S.settings?.uvoz?`<div class="banner" style="background:var(--ok-soft)">${icon('check')}<span>Подаци су увезени: <b>${esc(S.settings.uvoz)}</b>${S.settings.uvezeno?` · ${fmtDT(S.settings.uvezeno)}`:''}${S.settings.uvezao?` · ${esc(S.settings.uvezao)}`:''}. Ништа више не треба радити — ово дугме служи само ако се увоз мора поновити, а брише све што је у међувремену унето.</span></div>`:''}<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="seedR" type="button">${icon('file')}Замени све податке подацима из фајла…</button>${S.seedAvail&&S.settings?.uvoz!==S.seedAvail?`<button class="btn pri" id="seedB" type="button">${icon('file')}Учитај „Деловодник 2026“ (замени све)</button>`:''}<input type="file" id="seedF" accept=".json,application/json" hidden></div>
    <p class="sub" style="margin:0;font-size:12.5px">„Замени све“ прво брише све постојеће предмете, понуде, захтеве, пројекте, терен, уговоре, документацију, услуге, кориснике и евиденцију извоза, па уноси податке из фајла. Списак колега за пријаву остаје.</p></div></section>
  <section class="card"><div class="ch"><h2>Листе</h2><span class="sub" style="margin:0;font-size:12.5px">Једна ставка по реду</span></div><div class="cb"><div class="fg g3">${Object.keys(LIST_LBL).map(k=>field('li_'+k,LIST_LBL[k],(C.lists[k]||[]).join('\n'),'textarea',{rows:6})).join('')}</div></div></section>`};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function retry(fn){for(let i=0;;i++){try{return await fn()}catch(e){if(i>=5||!(e?.code==='rate_limited'||e?.code==='unavailable'||e?.code==='resource-exhausted'))throw e;await sleep(800*2**i)}}}
async function importSeed(data,replace){
  if(!S.db){toast('База није доступна.');return}
  const KEYS=['entries','services','clients','projects','zahtevi','ugovori','field'];
  if(replace){const del=[];['entries','offers','zahtevi','projects','field','ugovori','docs','services','clients','izvozi'].forEach(c=>S[c].forEach(d=>del.push([c,d.id])));
    for(let i=0;i<del.length;i+=20){await Promise.all(del.slice(i,i+20).map(([c,id])=>retry(()=>S.db.collection(c).doc(id).delete())));toast(`Брисање старих података: ${Math.min(del.length,i+20)} / ${del.length}`)}}
  const jobs=[];KEYS.forEach(k=>(data[k]||[]).forEach(d=>{const {id,...rest}=d;jobs.push([k,id,rest])}));
  for(let i=0;i<jobs.length;i+=20){await Promise.all(jobs.slice(i,i+20).map(([c,id,d])=>retry(()=>S.db.collection(c).doc(id).set(d))));toast(`Увоз у току: ${Math.min(jobs.length,i+20)} / ${jobs.length}`)}
  if(data.settings){const cur=S.settings||{};await retry(()=>S.db.doc('meta/settings').set({...data.settings,pragovi:{...data.settings.pragovi,...(cur.pragovi||{})},uvoz:data.verzija||'',uvezeno:nowISO(),uvezao:S.me||'',lists:{...data.settings.lists,zaposleni:[...new Set([...(cur.lists?.zaposleni||[]),...(data.settings.lists?.zaposleni||[])])]}}))}
  toast(`Готово: увезено ${jobs.length} записа.`);
}
const seedSummary=d=>`${(d.entries||[]).length} предмета, ${(d.clients||[]).length} корисника, ${(d.services||[]).length} услуга, ${(d.projects||[]).length} пројеката, ${(d.zahtevi||[]).length} захтева за фактурисање, ${(d.ugovori||[]).length} уговора, ${(d.field||[]).length} излазака на терен.`;
function askSeed(d){if(!d||(!d.clients&&!d.entries)){toast('Фајл није у очекиваном облику.');return}
  confirmBox('Заменити све податке?',`Све постојеће ће бити обрисано и замењено: ${seedSummary(d)} Ово се не може опозвати.`,'Обриши и увези',()=>importSeed(d,true).catch(e=>{handleWriteErr(e)}))}
BIND.podesavanja=()=>{
  $('#seedR').onclick=()=>$('#seedF').click();
  $('#seedF').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{askSeed(JSON.parse(await f.text()))}catch(e){toast('Фајл није могуће прочитати.')}ev.target.value=''};
  if($('#seedB'))$('#seedB').onclick=async()=>{try{const r=await fetch('pocetni-podaci.json',{cache:'no-store'});if(!r.ok)throw 0;askSeed(await r.json())}catch(e){toast('Фајл са подацима није објављен уз апликацију — изаберите га дугметом „Замени све податке подацима из фајла“.')}};
  $('#ss').onclick=async()=>{const pr={},po={},za={},li={};
  Object.keys(PRAG_LBL).forEach(k=>pr[k]=+val('pr_'+k)||0);Object.keys(POND_LBL).forEach(k=>po[k]=k==='pdv'?(+val('po_'+k)||0):val('po_'+k));po.napomena=$('#f_po_napomena').value;
  Object.keys(ZAH_LBL).forEach(k=>za[k]=val('za_'+k));
  Object.keys(LIST_LBL).forEach(k=>li[k]=$('#f_li_'+k).value.split('\n').map(s=>s.trim()).filter(Boolean));
  try{await saveSettings({pragovi:pr,ponuda:po,zahtev:za,lists:li});toast('Подешавања су сачувана.')}catch(e){}}};

/* ---------- модал и тост ---------- */
function confirmBox(t,p,ok,fn){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${esc(t)}</h2>${p?`<p>${esc(p)}</p>`:''}<div class="row"><button class="btn" data-x>Одустани</button><button class="btn pri" data-ok>${esc(ok)}</button></div></div>`;
  document.body.appendChild(m);const close=()=>m.remove();m.querySelector('[data-x]').onclick=close;m.onclick=e=>{if(e.target===m)close()};m.querySelector('[data-ok]').onclick=async()=>{close();try{await fn()}catch(e){}};m.querySelector('[data-ok]').focus()}
let tt;function toast(msg){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`${icon('check').replace('<svg','<svg style="width:16px;height:16px;color:#2FB8D4"')}<span>${esc(msg)}</span>`;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),3200)}

/* ---------- старт ---------- */
S.me=getMe();
route();
syncClock();
fetch('pocetni-podaci.json',{cache:'no-store'}).then(r=>r.ok&&(r.headers.get('content-type')||'').includes('json')?r.json():null).then(d=>{if(d?.verzija){S.seedAvail=d.verzija;scheduleRender()}}).catch(()=>{});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=bgTime();if(S.lastDay!==todayISO()){S.lastDay=todayISO();if(S.tab[S.page]!=='obrazac'&&!$('#drawer').classList.contains('on'))render()}},30000);S.lastDay=todayISO();
initDb().then(()=>{if(!S.me||S.needPass)showLogin()});
if(!S.me&&!window.FIREBASE_CONFIG?.apiKey)setTimeout(()=>{if(!S.me&&$('#login').hidden)showLogin()},400);
</script>
